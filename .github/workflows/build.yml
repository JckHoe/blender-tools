name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v5
        with:
          name: blender-render-queue
          path: target/release/blender-render-queue.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp target/release/blender-render-queue.exe "blender-render-queue-${GITHUB_REF_NAME}.exe"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: blender-render-queue-${{ github.ref_name }}.exe
